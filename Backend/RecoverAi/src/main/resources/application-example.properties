# =========================================================
# RecoverAI - Example Application Configuration
# =========================================================

spring.application.name=RecoverAi

# ---------------------------------------------------------
# Server
# ---------------------------------------------------------

server.port=8080


# ---------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recoverai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_database_password}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# ---------------------------------------------------------
# ML Recovery Prediction Service
# ---------------------------------------------------------

ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}


# ---------------------------------------------------------
# Razorpay
# ---------------------------------------------------------
# IMPORTANT:
# Razorpay API credentials and webhook secret are different.
# Never commit real credentials.

razorpay.api.key=${RAZORPAY_API_KEY:your_razorpay_api_key}
razorpay.api.secret=${RAZORPAY_API_SECRET:your_razorpay_api_secret}

razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:your_razorpay_webhook_secret}


# ---------------------------------------------------------
# Google Gemini
# ---------------------------------------------------------

gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key}

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-3.1-flash-lite